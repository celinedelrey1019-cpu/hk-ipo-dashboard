name: Daily HK IPO Update + Auto Pitch Analysis

on:
  schedule:
    # 每个工作日 UTC 02:00 = HKT 10:00
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    # 手动触发（GitHub Actions 页面 → Run workflow）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml akshare

      # ── 安装 Claude Code CLI ──────────────────────────────────────────────────
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # ── 运行每日抓取 + pitch 生成 ─────────────────────────────────────────────
      - name: Run daily IPO update
        env:
          # 方案一（推荐）: Claude Code OAuth Token
          # 本地运行: claude setup-token，把输出的 token 存进 GitHub Secrets
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # 方案二（备选）: Gemini 免费 API
          # 从 https://aistudio.google.com/app/apikey 获取，完全免费
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # 方案三: Anthropic API Key（需要单独 API 账号）
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scrape_hkex.py

      # ── 如有变更则自动提交 ────────────────────────────────────────────────────
      - name: Commit and push if changed
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add data/ index.html
          git diff --staged --quiet || git commit -m "data: auto-update $(date -u +%Y-%m-%d)" && git push
